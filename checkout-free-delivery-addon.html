     FREE DELIVERY PROGRESS — PASTE BEFORE </body>
========================================================= -->

<style>
/* Leave enough room so the fixed bar never covers the checkout button. */
body{
    padding-bottom:122px;
}

.free-delivery-bar{
    position:fixed;
    left:50%;
    bottom:16px;
    z-index:8000;
    width:min(720px,calc(100% - 28px));
    transform:translateX(-50%);
    padding:14px 16px 13px;
    overflow:hidden;
    border:1px solid rgba(255,255,255,.20);
    border-radius:18px;
    background:
        radial-gradient(circle at 8% 0%,rgba(255,255,255,.13),transparent 34%),
        linear-gradient(135deg,#2F241C 0%,#4A3728 58%,#604A38 100%);
    box-shadow:
        0 18px 50px rgba(39,29,22,.24),
        inset 0 1px 0 rgba(255,255,255,.12);
    color:#fff;
    font-family:"DM Sans",sans-serif;
    transition:
        background .35s ease,
        transform .35s ease,
        box-shadow .35s ease;
    isolation:isolate;
}

.free-delivery-bar::before{
    content:"";
    position:absolute;
    top:-55px;
    right:-45px;
    z-index:-1;
    width:145px;
    height:145px;
    border-radius:50%;
    background:rgba(255,255,255,.07);
}

.free-delivery-bar.unlocked{
    background:
        radial-gradient(circle at 8% 0%,rgba(255,255,255,.15),transparent 34%),
        linear-gradient(135deg,#40513B 0%,#63785B 58%,#768B6C 100%);
    box-shadow:
        0 18px 50px rgba(48,71,45,.25),
        inset 0 1px 0 rgba(255,255,255,.14);
}

.free-delivery-top{
    display:grid;
    grid-template-columns:42px minmax(0,1fr) auto;
    align-items:center;
    gap:11px;
}

.free-delivery-icon{
    width:42px;
    height:42px;
    display:flex;
    align-items:center;
    justify-content:center;
    border:1px solid rgba(255,255,255,.16);
    border-radius:13px;
    background:rgba(255,255,255,.10);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.10);
}

.free-delivery-icon svg{
    width:22px;
    height:22px;
    fill:none;
    stroke:currentColor;
    stroke-width:1.7;
    stroke-linecap:round;
    stroke-linejoin:round;
}

.free-delivery-copy{
    min-width:0;
}

.free-delivery-eyebrow{
    display:block;
    margin-bottom:3px;
    color:rgba(255,255,255,.62);
    font-size:8px;
    font-weight:700;
    letter-spacing:1.5px;
    text-transform:uppercase;
}

.free-delivery-message{
    display:block;
    color:#fff;
    font-size:13px;
    line-height:1.35;
    font-weight:700;
}

.free-delivery-message strong{
    color:#E8D4AD;
}

.free-delivery-bar.unlocked .free-delivery-message strong{
    color:#F4E5BD;
}

.free-delivery-percent{
    min-width:47px;
    padding:7px 8px;
    border:1px solid rgba(255,255,255,.16);
    border-radius:10px;
    background:rgba(255,255,255,.10);
    color:#fff;
    font-size:12px;
    font-weight:700;
    text-align:center;
}

.free-delivery-track{
    position:relative;
    height:6px;
    margin-top:11px;
    overflow:hidden;
    border-radius:999px;
    background:rgba(255,255,255,.16);
}

.free-delivery-progress{
    position:relative;
    width:0;
    height:100%;
    overflow:hidden;
    border-radius:inherit;
    background:linear-gradient(90deg,#D6B57C,#F1DCB4);
    box-shadow:0 0 15px rgba(241,220,180,.35);
    transition:width .55s cubic-bezier(.22,.8,.25,1);
}

.free-delivery-progress::after{
    content:"";
    position:absolute;
    inset:0;
    transform:translateX(-110%);
    background:linear-gradient(90deg,transparent,rgba(255,255,255,.65),transparent);
    animation:deliveryShine 2.4s ease-in-out infinite;
}

.free-delivery-bar.unlocked .free-delivery-progress{
    background:linear-gradient(90deg,#F0D9A7,#FFF0C8);
}

.delivery-free-label{
    display:inline-flex;
    align-items:center;
    gap:5px;
    color:#617758;
    font-weight:700;
}

.delivery-free-label::before{
    content:"✓";
    width:16px;
    height:16px;
    display:inline-flex;
    align-items:center;
    justify-content:center;
    border-radius:50%;
    background:#EAF1E6;
    font-size:9px;
}

@keyframes deliveryShine{
    0%,45%{transform:translateX(-110%)}
    75%,100%{transform:translateX(110%)}
}

@media(max-width:600px){
    body{
        padding-bottom:112px;
    }

    .free-delivery-bar{
        bottom:9px;
        width:calc(100% - 18px);
        padding:12px 13px 11px;
        border-radius:16px;
    }

    .free-delivery-top{
        grid-template-columns:37px minmax(0,1fr) auto;
        gap:9px;
    }

    .free-delivery-icon{
        width:37px;
        height:37px;
        border-radius:11px;
    }

    .free-delivery-icon svg{
        width:20px;
        height:20px;
    }

    .free-delivery-message{
        font-size:11px;
    }

    .free-delivery-percent{
        min-width:43px;
        padding:6px;
        font-size:11px;
    }

    .free-delivery-track{
        margin-top:9px;
    }
}

@media(max-width:365px){
    .free-delivery-eyebrow{
        display:none;
    }

    .free-delivery-message{
        font-size:10px;
    }
}

@media(prefers-reduced-motion:reduce){
    .free-delivery-progress{
        transition:none;
    }

    .free-delivery-progress::after{
        animation:none;
    }
}
</style>

<aside

                <path d="M5.5 9h5"/>

    >
        <div class="free-delivery-progress" id="freeDeliveryProgress"></div>
    </div>
</aside>

<script>
/* =========================================================
   FREE DELIVERY SETTINGS
========================================================= */

const FREE_DELIVERY_TARGET = 120;
const DELIVERY_CHARGE = 15;

function formatCheckoutPrice(value){
    return "$" + Number(value).toLocaleString(
        "en-US",
        {
            minimumFractionDigits:0,
            maximumFractionDigits:2
        }
    );
}


/* =========================================================
   PROGRESS BAR + ORDER TOTALS
========================================================= */

function updateFreeDeliveryProgress(subtotal){

    const bar =
        document.getElementById("freeDeliveryBar");

    const message =
        document.getElementById("freeDeliveryMessage");

    const percentageText =
        document.getElementById("freeDeliveryPercent");

    const progress =
        document.getElementById("freeDeliveryProgress");

    const track =
        document.getElementById("freeDeliveryTrack");

    const percentage = Math.min(
        100,
        Math.round(
            (subtotal / FREE_DELIVERY_TARGET) * 100
        )
    );

    const remaining = Math.max(
        0,
        FREE_DELIVERY_TARGET - subtotal
    );

    const unlocked =
        subtotal >= FREE_DELIVERY_TARGET;

    bar.classList.toggle("unlocked",unlocked);
    progress.style.width = percentage + "%";
    percentageText.textContent = percentage + "%";

    track.setAttribute(
        "aria-valuenow",
        Math.min(subtotal,FREE_DELIVERY_TARGET)
    );

    if(unlocked){

        message.innerHTML =
            "Brilliant! You've unlocked " +
            "<strong>FREE delivery!</strong> 🎉";

    }else if(subtotal > 0){

        message.innerHTML =
            "You're only <strong>" +
            formatCheckoutPrice(remaining) +
            " away</strong> from FREE delivery! 🎁";

    }else{

        message.innerHTML =
            "Add products to unlock " +
            "<strong>FREE delivery!</strong> 🎁";

    }
}


/* This replaces the old updateTotals() function. */
updateTotals = function(){

    const subtotal = PRODUCTS.reduce(
        (sum,product) =>
            sum + product.price * product.quantity,
        0
    );

    const shipping =
        !PRODUCTS.length
            ? 0
            : subtotal >= FREE_DELIVERY_TARGET
                ? 0
                : DELIVERY_CHARGE;

    const total = subtotal + shipping;

    document.getElementById("subtotal").textContent =
        formatCheckoutPrice(subtotal);

    const shippingElement =
        document.getElementById("shipping");

    if(PRODUCTS.length && shipping === 0){

        shippingElement.innerHTML =
            '<span class="delivery-free-label">FREE</span>';

    }else{

        shippingElement.textContent =
            formatCheckoutPrice(shipping);

    }

    document.getElementById("total").textContent =
        formatCheckoutPrice(total);

    updateFreeDeliveryProgress(subtotal);
};


/* =========================================================
   KEEP PRODUCT PRICES CONSISTENT IN DOLLARS
========================================================= */

function convertVisiblePricesToDollars(){

    document.querySelectorAll(
        ".product-price strong," +
        ".product-price small," +
        ".recommended-price"
    ).forEach(element => {

        element.textContent =
            element.textContent.replace(/MAD\s*/g,"$");

    });
}

const originalRenderProducts = renderProducts;

renderProducts = function(){
    originalRenderProducts();
    convertVisiblePricesToDollars();
};


/* =========================================================
   REPLACE THE OLD PLACE-ORDER LISTENER
========================================================= */

const oldPlaceOrderButton =
    document.getElementById("placeOrder");

const newPlaceOrderButton =
    oldPlaceOrderButton.cloneNode(true);

oldPlaceOrderButton.replaceWith(newPlaceOrderButton);

newPlaceOrderButton.addEventListener("click",() => {

    if(!PRODUCTS.length){
        alert("Please add at least one product.");
        return;
    }

    const name =
        document.getElementById("fullName").value.trim();

    const email =
        document.getElementById("email").value.trim();

    const city =
        document.getElementById("city").value.trim();

    const address =
        document.getElementById("address").value.trim();

    const phone =
        document.getElementById("phoneNumber").value.trim();

    if(!name){
        alert("Please enter your full name.");
        document.getElementById("fullName").focus();
        return;
    }

    if(!email){
        alert("Please enter your email address.");
        document.getElementById("email").focus();
        return;
    }

    const emailPattern =
        /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

    if(!emailPattern.test(email)){
        alert("Please enter a valid email address.");
        document.getElementById("email").focus();
        return;
    }

    if(!city){
        alert("Please enter your city.");
        document.getElementById("city").focus();
        return;
    }

    if(!address){
        alert("Please enter your delivery address.");
        document.getElementById("address").focus();
        return;
    }

    if(!phone){
        alert("Please enter your phone number.");
        document.getElementById("phoneNumber").focus();
        return;
    }

    const fullPhone =
        selectedPhoneCountry[2] + " " + phone;

    const subtotal = PRODUCTS.reduce(
        (sum,product) =>
            sum + product.price * product.quantity,
        0
    );

    const shipping =
        subtotal >= FREE_DELIVERY_TARGET
            ? 0
            : DELIVERY_CHARGE;

    const total = subtotal + shipping;

    alert(
        "Order ready!\n\n" +
        "Customer: " + name + "\n" +
        "Email: " + email + "\n" +
        "Phone: " + fullPhone + "\n" +
        "City: " + city + "\n" +
        "Delivery: " +
            (shipping === 0
                ? "FREE"
                : formatCheckoutPrice(shipping)) +
        "\nTotal: " + formatCheckoutPrice(total)
    );
});


/* =========================================================
   INITIAL UPDATE
========================================================= */

convertVisiblePricesToDollars();
updateTotals();
</script>
