<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hand Ben Quote Test</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 24px;
      background: #f7f7f7;
      color: #222;
    }

    button {
      width: 100%;
      padding: 16px;
      font-size: 16px;
      border: 0;
      border-radius: 10px;
      background: #222;
      color: white;
      cursor: pointer;
    }

    pre {
      margin-top: 20px;
      padding: 16px;
      background: white;
      border: 1px solid #ddd;
      border-radius: 10px;
      white-space: pre-wrap;
      word-break: break-word;
      min-height: 100px;
    }
  </style>
</head>

<body>

  <h2>Hand Ben — Quote Test</h2>

  <button id="testBtn">
    Run Quote Test
  </button>

  <pre id="result">Waiting for test...</pre>

  <script>
    const API_URL =
      "https://handben-orders-api-test.anasbenjelloun61.workers.dev/api/orders/quote";

    const result = document.getElementById("result");
    const button = document.getElementById("testBtn");

    button.addEventListener("click", async () => {

      button.disabled = true;
      result.textContent = "Testing...";

      try {

        const response = await fetch(API_URL, {
          method: "POST",

          headers: {
            "Content-Type": "application/json"
          },

          body: JSON.stringify({
            items: [
              {
                productId: "-P1erjPAOzJVqXv3hy52",
                variantId: "-P1eu_gIwRFaWvPh5UX0",
                quantity: 1
              }
            ]
          })
        });

        const text = await response.text();

        let data;

        try {
          data = JSON.parse(text);
        } catch {
          data = text;
        }

        result.textContent =
          "HTTP Status: " +
          response.status +
          "\n\n" +
          JSON.stringify(data, null, 2);

      } catch (error) {

        result.textContent =
          "ERROR:\n\n" +
          error.message;
      }

      button.disabled = false;
    });
  </script>

</body>
</html>
