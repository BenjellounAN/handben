<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hand Ben Order API Test</title>
</head>

<body>

  <h2>Hand Ben — Order API Test</h2>

  <button id="testBtn">Create Test Order</button>

  <pre id="result">Ready...</pre>

  <script>
    const API_URL =
      "https://handben-orders-api-test.anasbenjelloun61.workers.dev/api/orders/create";

    document.getElementById("testBtn").addEventListener("click", async () => {

      const result = document.getElementById("result");
      const button = document.getElementById("testBtn");

      button.disabled = true;
      result.textContent = "Sending request...";

      const payload = {
        customer: {
          fullName: "Test Customer",
          email: "test@example.com",
          phone: "+212600000000",
          country: "Morocco",
          countryCode: "MA",
          city: "Marrakech",
          address: "Test Address Marrakech"
        },

        items: [
          {
            productId: "-P1erjPAOzJVqXv3hy52",
            variantId: "-P1eu_gIwRFaWvPh5UX0",
            quantity: 1
          }
        ]
      };

      try {

        const response = await fetch(API_URL, {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify(payload)
        });

        const text = await response.text();

        let data;

        try {
          data = JSON.parse(text);
        } catch {
          data = text;
        }

        result.textContent =
          "HTTP STATUS: " + response.status +
          "\n\n" +
          JSON.stringify(data, null, 2);

      } catch (error) {

        result.textContent =
          "REQUEST FAILED\n\n" +
          String(error);

      } finally {
        button.disabled = false;
      }

    });
  </script>

</body>
</html>
